<!DOCTYPE html>
<!--
  zdesign · token 驱动骨架范式
  ─────────────────────────────
  所有视觉值都来自 :root 里的 CSS 变量,而这些变量从选定 DESIGN.md 的 YAML token 映射而来。
  下面的变量是「示例占位」(Linear 调性)——实际使用时,把 npx getdesign 产出的 DESIGN.md
  里的 colors / typography / rounded / spacing 逐项填进来,产出代码全程引用变量,绝不硬编码。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>zdesign · starter</title>
  <style>
    :root {
      /* === 从 DESIGN.md → colors 映射 === */
      --color-primary: #5e6ad2;
      --color-primary-hover: #828fff;
      --ink: #f7f8f8;
      --ink-muted: #d0d6e0;
      --ink-subtle: #8a8f98;
      --canvas: #010102;
      --surface-1: #0f1011;
      --surface-2: #141516;
      --hairline: #23252a;
      --semantic-success: #27a644;

      /* === 从 DESIGN.md → typography 映射(挑关键档) === */
      --font-display: "Linear Display", "SF Pro Display", -apple-system, sans-serif;
      --font-text: "Linear Text", "SF Pro Text", -apple-system, sans-serif;
      --fs-display: 56px; --lh-display: 1.10; --ls-display: -1.8px;
      --fs-headline: 28px; --lh-headline: 1.20; --ls-headline: -0.6px;
      --fs-body: 16px; --lh-body: 1.50;
      --fs-caption: 12px; --lh-caption: 1.40;

      /* === 从 DESIGN.md → rounded / spacing 映射 === */
      --radius-md: 8px;
      --radius-lg: 12px;
      --space-xs: 8px; --space-sm: 12px; --space-md: 16px;
      --space-lg: 24px; --space-xl: 32px; --space-section: 96px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--canvas);
      color: var(--ink);
      font-family: var(--font-text);
      font-size: var(--fs-body);
      line-height: var(--lh-body);
      -webkit-font-smoothing: antialiased;
    }

    .container { max-width: 1100px; margin: 0 auto; padding: var(--space-xl); }

    .eyebrow {
      font-size: var(--fs-caption);
      letter-spacing: 0.4px;
      text-transform: uppercase;
      color: var(--ink-subtle);
      margin-bottom: var(--space-sm);
    }

    h1 {
      font-family: var(--font-display);
      font-size: var(--fs-display);
      line-height: var(--lh-display);
      letter-spacing: var(--ls-display);
      font-weight: 600;
      margin-bottom: var(--space-md);
    }

    .lead { color: var(--ink-muted); max-width: 60ch; margin-bottom: var(--space-lg); }

    .card {
      background: var(--surface-1);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-lg);
      padding: var(--space-lg);
    }

    .btn {
      display: inline-flex; align-items: center; gap: var(--space-xs);
      background: var(--color-primary);
      color: var(--ink);
      border: none;
      border-radius: var(--radius-md);
      padding: var(--space-sm) var(--space-md);
      font: inherit; font-weight: 500;
      cursor: pointer;
      transition: background .15s ease, transform .15s ease;
      min-height: 44px; /* 触控目标 */
    }
    .btn:hover { background: var(--color-primary-hover); }
    .btn:active { transform: translateY(1px); }
    .btn:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }

    @media (max-width: 640px) {
      :root { --fs-display: 40px; --ls-display: -1.0px; }
      .container { padding: var(--space-lg); }
    }
  </style>
</head>
<body>
  <main class="container">
    <p class="eyebrow">zdesign starter</p>
    <h1>用设计系统驱动每一个像素</h1>
    <p class="lead">这份骨架展示如何把 DESIGN.md 的 token 映射成 CSS 变量,产出全程引用变量,保证视觉一致性。</p>
    <div class="card">
      <p>所有颜色、字号、圆角、间距都来自 <code>:root</code> 变量——换一套 DESIGN.md,整套界面自动跟随。</p>
      <p style="margin-top: var(--space-md);">
        <button class="btn" type="button">开始使用</button>
      </p>
    </div>
  </main>
</body>
</html>
