<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>zdesign · 设计资产</title>
  <link rel="icon" href="/__app/favicon.svg" type="image/svg+xml" />
  <script>(function(){try{var t=localStorage.getItem('zdesign-theme');if(!t)t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
  <link rel="stylesheet" href="/__app/style.css" />
</head>
<body data-tree="closed">
  <header class="topbar">
    <div class="brand">
      <button class="icon-btn" id="treeToggle" aria-label="切换文件树" title="文件树(折叠/展开)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
      </button>
      <strong class="logo">zdesign</strong>
      <span class="muted only-wide" id="meta">设计资产</span>
    </div>

    <div class="vp" id="vp">
      <div class="vp-seg" role="group" aria-label="预览尺寸">
        <button class="vp-btn active" type="button" data-vw="0" title="桌面(占满)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg><span>桌面</span>
        </button>
        <button class="vp-btn" type="button" data-vw="768" title="平板 768">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg><span>768</span>
        </button>
        <button class="vp-btn" type="button" data-vw="375" title="移动 375">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg><span>375</span>
        </button>
        <button class="vp-btn" type="button" data-vw="custom" title="自定义宽高">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="12" x2="3" y2="12"/><line x1="21" y1="18" x2="3" y2="18"/><circle cx="8" cy="6" r="2" fill="currentColor" stroke="none"/><circle cx="16" cy="12" r="2" fill="currentColor" stroke="none"/><circle cx="9" cy="18" r="2" fill="currentColor" stroke="none"/></svg><span>自定义</span>
        </button>
      </div>
      <span class="vp-custom">
        <input id="vpWidth" type="number" min="280" max="3000" step="8" value="1024" aria-label="自定义宽度" inputmode="numeric" />
        <span class="vp-x">×</span>
        <input id="vpHeight" type="number" min="400" max="3000" step="8" value="768" aria-label="自定义高度" inputmode="numeric" />
        <span class="vp-suffix">px</span>
      </span>
    </div>

    <button class="icon-btn" id="themeBtn" aria-label="切换浅色/深色主题" title="切换主题">
      <span id="themeIco"></span>
    </button>

    <div class="status"><span class="dot" id="dot"></span><span id="statusText" class="only-wide">连接中</span></div>

    <button class="icon-btn stop-btn" id="stopBtn" aria-label="停止预览服务" title="停止预览服务">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
    </button>
  </header>

  <div class="scrim" id="scrim"></div>

  <main class="layout">
    <aside class="tree" id="tree" aria-label="资产列表">
      <div class="tree-inner" id="treeInner"><p class="muted pad">加载中…</p></div>
    </aside>
    <section class="preview">
      <div class="preview-bar">
        <span id="currentFile" class="current">未选择资产</span>
        <span class="muted" id="vpLabel">桌面</span>
      </div>
      <div class="stage" id="stage">
        <div class="device" id="device" hidden><iframe id="frame" title="预览" frameborder="0"></iframe></div>
        <div class="special" id="special" hidden></div>
        <div class="empty" id="empty">
          <div class="empty-card">
            <div class="empty-logo">z</div>
            <p>从左侧选择一个资产预览</p>
            <p class="muted small">点顶栏图标展开文件树 · 改文件即时刷新 · 点链接自动跟随</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="/__app/app.js"></script>
</body>
</html>
